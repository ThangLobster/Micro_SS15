server:
  port: 8899

spring:
  application:
    name: gateway-service

  # Bài 5 - A: kết nối tới cùng cụm Redis với Identity-Service để check blacklist
  data:
    redis:
      host: localhost
      port: 6380
      database: 0

  cloud:
    gateway:
      routes:
        # Bài 2 - A: định tuyến /api/auth/** xuống Identity-Service (port 8090)
        - id: identity-service
          uri: http://localhost:8090
          predicates:
            - Path=/api/auth/**

        # Bài 2 - A: định tuyến /api/courses/** xuống Course-Service (port 8091)
        - id: course-service
          uri: http://localhost:8091
          predicates:
            - Path=/api/courses/**

app:
  jwt:
    # DÙNG CHUNG secret key với Identity-Service
    secret: "vS6K5vH8N2zB4xR9mQ3pL1wT7yC5vH8N2zB4xR9mQ3pL1wT7yC5vH8N2z"
