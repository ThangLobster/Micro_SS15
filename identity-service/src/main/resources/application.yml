server:
  port: 8090

spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:postgresql://localhost:5434/identity_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    redis:
      host: localhost
      port: 6380
      database: 0

# Bài 1 - B: khai báo thông số thời gian sống (TTL) của token trong application.yml
app:
  jwt:
    # Khoá ký HS256 (>= 32 bytes) - DÙNG CHUNG với Gateway-Service
    secret: "vS6K5vH8N2zB4xR9mQ3pL1wT7yC5vH8N2zB4xR9mQ3pL1wT7yC5vH8N2z"
    # 15 phút
    access-token-expiration: 900000
    # 7 ngày
    refresh-token-expiration: 604800000
